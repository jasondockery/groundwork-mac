# Groundwork's Herdr baseline keeps the same prefix and core mnemonics as its
# tmux setup. `groundwork-herdr-config edit` opens this source; user-owned
# configuration is never overwritten silently.
onboarding = false

[theme]
name = "catppuccin"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = ["ctrl+space", "ctrl+b"]

# Use Omarchy's actions across platforms; keep displaced settings reachable.
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+q"
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]
copy_mode = "prefix+["

# Pane keys match Omarchy's Herdr and tmux configurations.
split_vertical = ["prefix+v", "alt+shift+enter", "prefix+|"]
split_horizontal = ["prefix+h", "alt+enter", "prefix+minus"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"
# Shift+K now closes the workspace, as it does in Omarchy. Avoid retaining a
# competing pane-swap action on the same key.
swap_pane_left = []
swap_pane_down = []
swap_pane_up = []
swap_pane_right = []
rename_pane = "prefix+shift+o"

# Herdr tabs carry the tmux window shortcuts; workspaces carry session intent.
new_tab = "prefix+c"
rename_tab = ["prefix+r", "prefix+comma"]
close_tab = ["prefix+k", "prefix+ampersand"]
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"
workspace_picker = "prefix+s"
goto = "prefix+shift+t"
new_workspace = "prefix+shift+c"
rename_workspace = ["prefix+shift+r", "prefix+$"]
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "if [ -n \"${HERDR_ACTIVE_PANE_CWD:-}\" ]; then cd \"$HERDR_ACTIVE_PANE_CWD\" || exit; fi; exec lazygit"
description = "open lazygit in the active pane directory when available"
width = "90%"
height = "90%"

[session]
resume_agents_on_restore = true

[remote]
# SSH configuration remains user/repository authority. Herdr uses plain ssh.
manage_ssh_config = false

[experimental]
allow_nested = false
# Pane output can contain secrets. Live detach preserves it without writing it.
pane_history = false

[ui]
sidebar_start_collapsed = false
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_scrollbars = false
pane_gaps = false

[ui.sound]
enabled = false
